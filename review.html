<meta property="og:url" content="https://www.allbeesolutions.com/review"><meta property="og:title" content="Customer Reviews | AllBee Invitations"><meta property="og:description" content="Read and submit moderated customer reviews for AllBee Invitations."><meta property="og:image" content="https://www.allbeesolutions.com/og-image.jpg">
<meta name="theme-color" content="#0F7B6E">
<link rel="icon" href="/favicon.ico?v=20260524b" sizes="any">

<body>
<div class="bar">AllBee Invitations</div>
<main class="wrap">
  <div class="hd"><span class="eb">Your Review</span><h1>How was your invitation?</h1><p>Your words help other families choose with confidence.</p></div>
  <div class="card" id="card">
    <form id="rvForm" novalidate>
      <input type="text" class="hp" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true">
      <div class="field"><label id="rating-label">Your Rating</label><div class="stars" id="stars" role="radiogroup" aria-labelledby="rating-label"><span data-v="1" role="radio" tabindex="0" aria-label="1 star" aria-checked="false">★</span><span data-v="2" role="radio" tabindex="0" aria-label="2 stars" aria-checked="false">★</span><span data-v="3" role="radio" tabindex="0" aria-label="3 stars" aria-checked="false">★</span><span data-v="4" role="radio" tabindex="0" aria-label="4 stars" aria-checked="false">★</span><span data-v="5" role="radio" tabindex="0" aria-label="5 stars" aria-checked="false">★</span></div></div>
      <div class="row">
        <div class="field"><label for="rv-name">Your Name</label><input id="rv-name" name="name" required></div>
        <div class="field"><label for="rv-city">City</label><input id="rv-city" name="city" placeholder="e.g. Nagapattinam"></div>
      </div>
      <div class="field"><label for="rv-event">Event Type</label><select id="rv-event" name="event_type"><option value="">Select…</option><option>Wedding</option><option>Nikah</option><option>Birthday</option><option>Housewarming</option><option>Business Event</option><option>Other</option></select></div>
      <div class="field"><label for="rv-review">Your Review</label><textarea id="rv-review" name="review" rows="4" placeholder="What did you and your guests love?" required></textarea></div>
      <button class="btn" type="submit" id="go">Submit Review</button>
      <div class="err" id="err" role="alert" aria-live="assertive"></div>
    </form>
  </div>
  <div class="card ok" id="ok" role="status" aria-live="polite"><div class="big">🌟</div><h2>Thank you!</h2><p>Your review has been received and will appear once our team approves it.</p></div>
</main>
<script src="/assets/flow-review-1.js"></script>
<script src="/assets/allbee-assistant.js?v=20261003" defer></script>
<script src="/assets/site-analytics.js?v=20261003" defer></script>
</body>
</html>
