<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lead CRM — AllBee Invitations</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico?v=20260524b" sizes="any">
<meta name="theme-color" content="#0F7B6E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Lato:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/csp-style-admin-invitation-leads-1.css">
</head>
<body>
<nav class="admin-nav" aria-label="Admin sections"><span>AllBee Admin</span><a href="/admin/ceo">Overview</a><a href="/admin/invitation-leads" aria-current="page">Leads</a><a href="/admin/invitation-orders">Orders</a><a href="/admin/reviews">Reviews</a><a href="/admin/launch">Launch</a></nav>

<!-- Passcode lock -->
<div class="lock" id="lock">
  <div class="lock-card">
    <h1>🐝 Lead CRM</h1>
    <p>AllBee Invitations — team access</p>
    <div class="lock-err" id="lockErr"></div>
    <input id="passInput" aria-label="Admin passcode" type="password" placeholder="Admin passcode" autocomplete="off">
    <button class="btn-go" id="passGo">Open CRM</button>
    <span class="demo-link" id="demoLink">Preview with demo data →</span>
  </div>
</div>

<header class="topbar">
  <div class="wrap">
    <div class="brand"><b>AllBee Invitations</b><span>Lead CRM</span></div>
    <div class="tb-actions">
      <span class="conn demo" id="conn">Demo</span>
      <button class="tb-btn" id="refreshBtn">Refresh</button>
      <button class="tb-btn" id="signoutBtn">Sign out</button>
    </div>
  </div>
</header>

<main class="wrap" style="padding-top:18px;padding-bottom:60px">
  <div class="banner" id="banner" style="display:none"></div>

  <div class="stats" id="stats"></div>
  <div class="pipe" id="pipe"></div>

  <div class="toolbar">
    <input type="search" id="search" aria-label="Search leads" placeholder="Search name, mobile or email…">
    <select id="fType" aria-label="Event type"><option value="">All event types</option></select>
    <select id="fStatus" aria-label="Status"><option value="">All statuses</option></select>
    <span class="daterange">From <input type="date" id="fFrom" aria-label="Start date"> to <input type="date" id="fTo" aria-label="End date"></span>
    <button class="clear" id="clearBtn">Clear</button>
  </div>

  <div class="lhead">
    <div>Lead ID</div><div>Name / Mobile</div><div>Event</div><div>Source / Date</div><div>Status</div><div></div>
  </div>
  <div id="list"></div>
  <div class="empty" id="empty" style="display:none">No leads match your filters.</div>
</main>

<!-- Lead modal -->
<div class="modal" id="modal">
  <div class="modal-bg" data-close></div>
  <div class="modal-card">
    <div class="modal-head"><h2 id="mTitle">Lead</h2><button class="x" data-close>&times;</button></div>
    <div class="modal-body" id="mBody"></div>
    <div class="modal-foot">
      <button class="btn btn-save" id="mSave">Save changes</button>
      <button class="btn btn-won" id="mConvert" style="background:var(--gold);color:#3a2c06">Convert to Order →</button>
      <button class="btn btn-won" id="mWon">Mark Won</button>
      <button class="btn btn-lost" id="mLost">Mark Lost</button>
      <button class="btn btn-ghost" data-close>Close</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/assets/admin-auth.js"></script>
<script src="/assets/admin-invitation-leads.js"></script>
</body>
</html>
