name: AllBee static audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, pinned
        with:
          fetch-depth: 0
      - name: Check HTML, routes, images and API syntax
        run: |
          node scripts/audit.mjs
          node scripts/pricing-check.mjs
          node scripts/invitation-order-integrity-check.mjs
          node scripts/contextual-enquiry-check.mjs
          node scripts/site-quality-check.mjs
          node scripts/whatsapp-template-check.mjs
          node scripts/api-regression.mjs
          node scripts/reference-upload-check.mjs
          node scripts/reference-sink-check.mjs
      - name: Security regression and tracked/history secret heuristics
        run: |
          node scripts/security-regression.mjs
          node scripts/webhook-security-check.mjs
          node scripts/security-scan.mjs --history
          node scripts/verify-website-ai.cjs
          node scripts/admin-mfa-check.mjs
          node scripts/admin-csp-check.mjs
          node scripts/flow-csp-check.mjs
          node scripts/public-csp-check.mjs
          node scripts/inline-style-csp-check.mjs
          node scripts/invitations-restore-check.mjs
          node scripts/legacy-leads-migration-check.mjs
      - name: Optional customer analytics privacy and CSP regression
        run: node --test tests/site-analytics-consent.test.cjs tests/site-analytics-csp-integration.test.cjs
      - name: Strict-CSP browser interactions — desktop
        env:
          CSP_BROWSER_QUICK: '1'
          CSP_BROWSER_VIEWPORT: 'desktop'
          CSP_BROWSER_REQUIRED: '1'
        run: node scripts/public-csp-browser-check.mjs
      - name: Strict-CSP browser interactions — narrow/mobile window
        env:
          CSP_BROWSER_QUICK: '1'
          CSP_BROWSER_VIEWPORT: 'mobile'
          CSP_BROWSER_REQUIRED: '1'
        run: node scripts/public-csp-browser-check.mjs
      - name: Strict-CSP browser interactions — tablet window
        env:
          CSP_BROWSER_QUICK: '1'
          CSP_BROWSER_VIEWPORT: 'tablet'
          CSP_BROWSER_REQUIRED: '1'
        run: node scripts/public-csp-browser-check.mjs
